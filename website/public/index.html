<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f1a">
    <title>Md Sharif - Portfolio</title>

          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
</head>

</body>
